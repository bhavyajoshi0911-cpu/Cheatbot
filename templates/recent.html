{% extends 'base.html' %}

{% block content %}
<section class="panel-card page-content">
    <div class="section-header">
        <div><span class="section-kicker">Pick up where you left off</span><h3>Recently opened</h3></div>
    </div>
    {% if recent %}
    <div class="list-stack">
        {% for item in recent %}
        <div class="mini-list-row">
            <span>{{ item.icon }} {{ item.name }}</span>
            <small>{{ item.last_used }}</small>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-box">
        <div class="empty-icon">🕘</div>
        <h4>No recent activity.</h4>
    </div>
    {% endif %}
</section>
{% endblock %}
